services:
  we-mp-rss:
    image: ${WE_MP_RSS_IMAGE:-ghcr.io/anguslean/we-mp-rss:latest}
    container_name: ${WE_MP_RSS_CONTAINER_NAME:-we-mp-rss}
    restart: unless-stopped
    ports:
      - "${WE_MP_RSS_PORT:-8002}:8001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB: ${DB:-sqlite:///data/we_mp_rss.db}
      USERNAME: ${USERNAME:-admin}
      PASSWORD: ${PASSWORD:-please-change-me}
      AUTO_RELOAD: ${AUTO_RELOAD:-False}
      PORT: "8001"
      PROXY_ENABLED: ${PROXY_ENABLED:-False}
    volumes:
      - ${WE_MP_RSS_DATA_DIR:-./data}:/app/data
