name: Docker Image Publish GITHUB
permissions:
  contents: read
  packages: write
on:
  push:
    branches:
      - main
    paths:  # 仅在指定文件变化时触发（可选）
      - 'core/ver.py'
  workflow_dispatch:  # 支持手动触发
#   release:
#     types: [published]
jobs:
  build-and-push-docker-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize GHCR image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
     
      - name: Build and Push Multi-platform Docker Image
        run: |
          echo 构建多架构镜像: ${IMAGE_NAME}
          echo 创建并使用buildx构建器（支持多架构）
          docker buildx create --name multiarch --use 2>nul || docker buildx use multiarch
          echo 构建多架构镜像
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${IMAGE_NAME}:latest \
            --label "org.opencontainers.image.source=https://github.com/${{github.repository}}" \
            --label "org.opencontainers.image.description=WeRss 微信公众号RSS订阅服务" \
            --label "org.opencontainers.image.licenses=MIT" \
            --push .
